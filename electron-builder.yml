appId: com.suja.ytforge
productName: YT-Forge
icon: build/icon.png
directories:
  output: release

files:
  - dist-electron/**/*
  - dist/**/*
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # ffmpeg-static's darwin-arm64 build is --enable-nonfree and may not be
  # redistributed, so it must not be inside the DMG at all — not merely unused.
  # bin/ffmpeg_macos (see scripts/fetch-ffmpeg.mjs) is macOS's only FFmpeg.
  #
  # A platform `files` list REPLACES the top-level one rather than extending it,
  # so the top-level entries are repeated here. Keep the two lists in sync.
  files:
    - dist-electron/**/*
    - dist/**/*
    - package.json
    - "!**/node_modules/ffmpeg-static/**"
  extraResources:
    - from: bin/yt-dlp_macos
      to: bin/yt-dlp_macos
    # Clean GPLv3 FFmpeg; replaces ffmpeg-static's unredistributable
    # --enable-nonfree darwin-arm64 build. See scripts/fetch-ffmpeg.mjs.
    - from: bin/ffmpeg_macos
      to: bin/ffmpeg_macos

win:
  target:
    - nsis
  extraResources:
    - from: bin/yt-dlp.exe
      to: bin/yt-dlp.exe

nsis:
  oneClick: true
  perMachine: false

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  extraResources:
    - from: bin/yt-dlp_linux
      to: bin/yt-dlp_linux

publish:
  provider: github
  owner: YT-Forge-Official
  repo: YT-Forge
